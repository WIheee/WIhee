<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 - WIhee</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: 
                url('https://raw.githubusercontent.com/WIheee/WIhee/main/src/%E4%BC%8A%E8%95%BE%E5%A8%9C.png.jpeg') 
                center/cover no-repeat fixed,
                linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 返回按钮 */
        .back-btn {
            position: fixed;
            left: 24px;
            bottom: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 24px;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .back-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* 文章卡片 */
        .article-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 30px;
        }
        
        .article-title {
            font-size: 32px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 24px;
            text-align: center;
        }
        
        .article-meta {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .article-content {
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap; /* 识别换行 */
            word-wrap: break-word;
            /* 文本居中 */
            text-align: center;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            
            .article-card {
                padding: 24px;
            }
            
            .back-btn {
                left: 16px;
                bottom: 16px;
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
            
            .article-title {
                font-size: 24px;
            }
            
            .article-content {
                font-size: 14px;
                line-height: 1.6;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 文章卡片 -->
        <div class="article-card">
            <h1 class="article-title">test</h1>
            
            <div class="article-meta">
                发布于 2025年10月 • 阅读量 114514
            </div>
            
            <div class="article-content">
test
            </div>
        </div>
    </div>
    
    <!-- 返回按钮 -->
    <a href="https://你的导航页链接.com" class="back-btn">
        ←
    </a>
</body>
</html>
